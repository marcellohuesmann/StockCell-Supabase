<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#grad)"/>
  <g transform="translate(12, 10)" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Phone outline -->
    <rect x="6" y="0" width="28" height="44" rx="4" />
    <!-- Screen -->
    <rect x="10" y="6" width="20" height="26" rx="1" fill="rgba(255,255,255,0.1)"/>
    <!-- Barcode lines on screen -->
    <line x1="14" y1="12" x2="14" y2="24" stroke-width="1.5"/>
    <line x1="17" y1="12" x2="17" y2="24" stroke-width="2.5"/>
    <line x1="20" y1="12" x2="20" y2="24" stroke-width="1"/>
    <line x1="23" y1="12" x2="23" y2="24" stroke-width="2"/>
    <line x1="26" y1="12" x2="26" y2="24" stroke-width="1.5"/>
    <!-- Home button -->
    <circle cx="20" cy="38" r="2"/>
  </g>
</svg>
