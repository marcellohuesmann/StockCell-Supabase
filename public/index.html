<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="StockCell - Sistema de Gestão de Vendas e Estoque para acessórios de celular">
    <meta name="theme-color" content="#0a0a14">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="StockCell">
    
    <title>StockCell - Gestão de Vendas e Estoque</title>
    
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/svg+xml" href="/assets/logo.svg">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">
    
    <!-- CSS -->
    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/login.css">
    <link rel="stylesheet" href="/css/dashboard.css">
    <link rel="stylesheet" href="/css/pdv.css">
    <link rel="stylesheet" href="/css/cashregister.css">
    <link rel="stylesheet" href="/css/animations.css">
    <style>
        @media print {
            .sidebar, .header, .bottom-nav, .report-tab, #btn-generate-report, #btn-print-report, .toast-container { display: none !important; }
            .main-content { margin-left: 0 !important; padding: 0 !important; }
            .app-container { display: block !important; }
            .kpi-card { break-inside: avoid; border: 1px solid #ddd !important; }
            .card { break-inside: avoid; border: 1px solid #ddd !important; }
            body { background: #fff !important; color: #000 !important; }
            .page-title { color: #000 !important; }
        }
    </style>
</head>
<body>
    <!-- App Root -->
    <div id="app">
        <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;background-color:var(--bg-dark);color:var(--text-main);">
            <div style="font-size:3rem;margin-bottom:var(--space-md);">📱</div>
            <h2 style="margin-bottom:var(--space-xl);color:var(--text-main);">StockCell</h2>
            <div class="spinner" style="width:30px;height:30px;border-color:rgba(255,255,255,0.1);border-top-color:var(--accent-primary);"></div>
            <p style="margin-top:var(--space-md);color:var(--text-secondary);font-size:var(--font-size-sm);">Sincronizando dados...</p>
        </div>
    </div>

    <!-- Modal de Busca Global (Ctrl+K) -->
    <div id="modal-global-search" class="modal-overlay" style="display: none; align-items: flex-start; padding-top: 10vh;">
        <div class="modal" style="max-width: 600px; width: 100%; border-radius: 12px; overflow: hidden; padding: 0;">
            <div style="display: flex; align-items: center; padding: 15px 20px; border-bottom: 1px solid var(--border);">
                <span style="font-size: 20px; color: var(--text-muted); margin-right: 15px;">🔍</span>
                <input type="text" id="global-search-input" placeholder="Buscar produtos, clientes, vendas... (Ctrl+K)" style="flex: 1; border: none; background: transparent; font-size: 16px; color: var(--text-main); outline: none;">
                <button class="btn btn-sm btn-ghost" id="btn-close-global-search" style="font-size: 12px;">ESC</button>
            </div>
            <div id="global-search-results" style="max-height: 400px; overflow-y: auto; padding: 10px 0;">
                <div style="padding: 20px; text-align: center; color: var(--text-muted); font-size: 14px;">Digite pelo menos 2 caracteres...</div>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toast-container" class="toast-container"></div>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>

    <!-- JS -->
    <script src="/js/utils.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/components/toast.js"></script>
    <script src="/js/components/modal.js"></script>
    <script src="/js/components/sidebar.js"></script>
    <script src="/js/components/header.js"></script>
    <script src="/js/pages/login.js"></script>
    <script src="/js/pages/dashboard.js"></script>
    <script src="/js/pages/categories.js"></script>
    <script src="/js/pages/products.js"></script>
    <script src="/js/pages/customers.js"></script>
    <script src="/js/pages/suppliers.js"></script>
    <script src="/js/pages/pdv.js"></script>
    <script src="/js/pages/cashregister.js"></script>
    <script src="/js/pages/stock.js"></script>
    <script src="/js/pages/os.js"></script>
    <script src="/js/pages/settings.js"></script>
    <script src="/js/pages/finance.js"></script>
    <script src="/js/pages/reports.js"></script>
    <script src="/js/pages/logs.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
